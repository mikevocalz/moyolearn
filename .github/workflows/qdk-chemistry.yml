# Lightweight QDK HTTP/security contracts and a separate real numerical smoke test.
# Neither job needs private worker tokens or deployed infrastructure.
name: QDK Chemistry Contracts
on:
  pull_request:
    paths:
      - 'services/qdk-chemistry/**'
      - 'apps/web/app/api/chemistry/**'
      - 'packages/app/features/chemistry/**'
      - '.github/workflows/qdk-chemistry.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  worker-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/qdk-chemistry/requirements.txt
      - name: Install lightweight HTTP test dependencies
        run: python -m pip install "fastapi>=0.115,<1" "httpx>=0.27,<1" "pydantic>=2,<3"
      - name: Run contract and security tests
        run: python -m unittest discover -s services/qdk-chemistry -p 'test_*.py'

  solver-smoke:
    # QDK 2.2 publishes manylinux_2_39 wheels: Ubuntu 24.04 supplies glibc 2.39.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/qdk-chemistry/requirements.txt
      - name: Install the real numerical worker dependencies
        run: python -m pip install -r services/qdk-chemistry/requirements.txt
      - name: Compute both admitted molecular energies without mocks
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python services/qdk-chemistry/smoke_solver.py
