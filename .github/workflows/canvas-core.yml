name: Installed canvas core
on:
  pull_request:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify the installed core with sanitizers
        run: |
          c++ -std=c++17 -pthread -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I node_modules/nitro-canvas-in-Vision/cpp node_modules/nitro-canvas-in-Vision/cpp/CanvasInViroCore.cpp tests/native/canvas-core-lifecycle.cpp -o /tmp/canvas-core-test
          /tmp/canvas-core-test
