name: Forge board document contract
on:
  pull_request:
    paths:
      - 'packages/app/features/tutor/*board*'
      - 'packages/ui/ForgeBoardIcon.tsx'
      - 'packages/ui/Whiteboard.tsx'
      - 'vendors/*forge*'
      - 'pnpm-lock.yaml'
      - '.github/workflows/forge-board.yml'
permissions:
  contents: read
jobs:
  document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Existing document, history, storage and read-only source
        run: node --test packages/app/features/tutor/board-doc.test.ts packages/app/features/tutor/board-session.test.ts packages/app/features/tutor/forge-board-source.test.ts packages/app/features/tutor/forge-board-session.test.ts packages/app/features/tutor/forge-board-storage.test.ts packages/app/features/tutor/forge-board-history.test.ts packages/app/features/tutor/forge-board-gesture-history.test.ts packages/app/features/tutor/forge-board-gesture-lifecycle.test.ts
      - name: Actual pinned Forge encoder, binding and scene compiler
        run: pnpm --filter @acme/app test:forge
      - name: Keyboard history uses the same document
        run: node --test packages/ui/whiteboard-history.test.ts
      - name: App and toolbar types
        run: pnpm --filter @acme/app --filter @acme/ui typecheck
      - name: Preserve headset window contract
        run: node --test apps/mobile/plugins/__tests__/spatial-window-contract.test.cjs
