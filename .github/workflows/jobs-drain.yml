# The */30 handler tick — doc 35 §5 / PR-135's GitHub-Actions half, replacing
# the `*/30` Vercel cron that kept the deployment off the Hobby tier.
#
# This is the RETRY path, not the primary one: sweeps run inside their own
# daily crons, and request-adjacent work drains via `after()` in the routes
# that enqueue it. What this tick guarantees is that a job whose handler threw
# comes back on its queue's ladder within ~30 minutes, and that JOB-3
# dead-letter depth is evaluated even on a queue with no new work. GitHub's
# schedule floor is ~5 minutes and timing is best-effort — acceptable for a
# path whose latency floor was always the schedule (`packages/jobs/src/drain.ts`).
# The in-database half (pg-boss retention maintenance) runs on Supabase
# pg_cron — see `packages/payload/migrations/jobs_pg_cron_maintenance.sql` for
# the full split. `/api/health/jobs` is the dead-man switch over both.
#
# Secrets (repo settings → Actions):
#   JOBS_DRAIN_URL     https://<production-host>/api/jobs/drain
#   JOBS_DRAIN_SECRET  the same bearer the route already requires
name: jobs-drain
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Drain the live queues
        env:
          JOBS_DRAIN_URL: ${{ secrets.JOBS_DRAIN_URL }}
          JOBS_DRAIN_SECRET: ${{ secrets.JOBS_DRAIN_SECRET }}
        run: |
          if [ -z "$JOBS_DRAIN_URL" ] || [ -z "$JOBS_DRAIN_SECRET" ]; then
            echo '::error::JOBS_DRAIN_URL / JOBS_DRAIN_SECRET are not configured — the retry tick is not running.'
            exit 1
          fi
          # NO -f. `-f` makes curl discard the response body on a non-2xx and
          # exit 22, which is how seven consecutive 500s produced nothing but
          # "The requested URL returned error: 500" — while the route was
          # returning `{"ok":false,"error":"pg-boss database requires
          # migrations"}` in the body it threw away. The body is queue names,
          # counts and an operator-facing message; printing it leaks nothing,
          # and NOT printing it cost a day (docs/incidents/2026-09-22-jobs-drain-outage.md).
          #
          # -o/-w splits body from status so both survive: the body goes to a
          # file, the status to stdout. A transport failure (DNS, TLS, the
          # --max-time ceiling) never reaches the status line, so curl's own
          # exit code is checked first and separately — an empty status is a
          # different failure from a 500 and must not be reported as one.
          status=$(curl -sS -X POST "$JOBS_DRAIN_URL" \
            -H "Authorization: Bearer $JOBS_DRAIN_SECRET" \
            --max-time 320 \
            -o drain-response.json \
            -w '%{http_code}') || {
              echo "::error::curl failed before a response arrived (exit $?). The drain was not reached."
              exit 1
            }

          echo "HTTP $status"
          echo '--- response body ---'
          # `cat` and not `jq`: the body on the failure path may not be JSON at
          # all — a platform 502 is HTML — and a parse error here would replace
          # the evidence with a parse error, which is the bug being fixed.
          cat drain-response.json
          echo
          echo '--- end response body ---'

          case "$status" in
            2??) ;;
            *)
              echo "::error::POST /api/jobs/drain returned $status — see the response body above."
              exit 1
              ;;
          esac
