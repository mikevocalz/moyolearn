name: visionOS native
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/visionos.yml'
      - 'apps/mobile/**'
      - 'packages/app/features/tutor/**'
      - 'packages/ui/xr/**'
      - 'patches/**'
      - 'vendors/**'
      - 'tooling/*visionos*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
permissions:
  contents: read
concurrency:
  group: visionos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: visionOS simulator build
    # Nitro V1 Swift packages declare swift-tools-version 6.4, which needs Xcode 27.
    # `xcode-27` is the GitHub-hosted preview image whose default Xcode is 27.1.
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Check native build cache behavior
        run: node --test tooling/visionos-build-cache.test.mjs
      - name: Verify Apple SDKs
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk xros --show-sdk-version
          xcrun --sdk xrsimulator --show-sdk-version
      - run: pnpm install --frozen-lockfile
      - name: Build pinned ViroKit and resolve native dependencies
        run: |
          set -o pipefail
          mkdir -p artifacts/visionos
          pnpm --filter mobile visionos:prepare 2>&1 | tee artifacts/visionos/prepare.log
      - name: Compile app and native tests
        run: |
          set -o pipefail
          xcodebuild -workspace apps/mobile/visionos/Moyo.xcworkspace \
            -scheme Moyo -configuration Debug \
            -destination 'generic/platform=visionOS Simulator' \
            -derivedDataPath artifacts/visionos/DerivedData \
            -resultBundlePath artifacts/visionos/Build.xcresult \
            CODE_SIGNING_ALLOWED=NO build-for-testing \
            2>&1 | tee artifacts/visionos/build.log
      - name: Keep diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visionos-native-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            artifacts/visionos/*.log
            artifacts/visionos/*.xcresult
            apps/mobile/visionos/Podfile.lock
