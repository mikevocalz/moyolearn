name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on committed .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env(\..*)?$' | grep -v '\.env\.example$'; then
            echo '::error::.env files must never be committed'; exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Single source of truth for the Node floor (Payload 4 canary requires >= 24.15.0, Expo breaks on 26).
          # Bump .nvmrc and the root package.json "engines" together.
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --continue: without it turbo kills every sibling task on the first
      # failure, and each one then prints a bare ELIFECYCLE with no output. One
      # missing eslint.config.mjs read as nine broken packages that way. The run
      # still exits non-zero, so this reports more without gating less.
      - run: pnpm exec turbo run build typecheck lint test --continue
