name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Whole-graph gate. This is the only job that runs typecheck/lint/test, and it
  # is deliberately NOT the only job that builds — see `web-app` below for why.
  ci:
    name: turbo (build / typecheck / lint / test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fail on committed .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env(\..*)?$' | grep -v '\.env\.example$'; then
            echo '::error::.env files must never be committed'; exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Single source of truth for the Node floor (Payload 4 canary requires >= 24.15.0, Expo breaks on 26).
          # Bump .nvmrc and the root package.json "engines" together.
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Module exports, protected learner routes and the motion-duration gate
        run: node --test tooling/check-barrels.test.mjs tooling/learner-routes.test.mjs tooling/check-motion-durations.test.mjs
      - name: Prepare avatar assets for repository guards
        run: node apps/web/scripts/copy-avatar-assets.mjs
      - name: Repository guards and workspace lint
        run: pnpm lint
      # --continue: without it turbo kills every sibling task on the first
      # failure, and each one then prints a bare ELIFECYCLE with no output. A
      # single missing eslint.config.mjs read as nine broken packages that way
      # (docs/issues/2026-09-13-turbo-lint-failures.md). The run still exits
      # non-zero, so this reports more without gating less.
      - run: pnpm exec turbo run build typecheck test --continue

  # Per-application build + artifact + runtime coverage.
  #
  # Why this job exists on top of `ci`'s `turbo run build`:
  #
  #   1. A green `turbo run build` does not mean an artifact exists. At commit
  #      4514541 `web-vite#build` and `admin-vite#build` declared `outputs: ["dist/**"]`
  #      while the apps actually emit `.output/**` and `.vercel/output/**`, so turbo
  #      cached both tasks as producing nothing: deleting `apps/web-vite/.output` and
  #      re-running the build replayed a cache hit, exited 0, and left no server bundle
  #      behind. The outputs keys have since been corrected, and the "Assert the build
  #      produced a deployable artifact" step below is the regression guard that keeps
  #      them correct — it fails the run instead of shipping an empty deploy.
  #
  #   2. Web tests cover the voice cache; they do not boot built output. `test`
  #      remains a no-op in web-vite,
  #      admin-vite, storybook, mobile, @acme/art, @acme/assets, @acme/config and
  #      @acme/theme. Before this job, nothing in CI ever executed the built output.
  #      Booting the server and asserting real rendered HTML is the first behavioural
  #      check any of these apps has had.
  web-app:
    name: app (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Next.js. Serves with PORT=<port> — note `pnpm --filter web start -- -p <port>`
          # does NOT work, apps/web/scripts/next.mjs forwards argv as positionals.
          # `/` and `/login` are server-rendered with no database reachable.
          - app: web
            artifact: apps/web/.next/BUILD_ID
            port: '3101'
            start: pnpm --filter web start
            # `/` is NOT public — it is absent from PUBLIC_PATHS in apps/web/proxy.ts,
            # so a signed-out visitor is redirected to /login and `fetch` follows it.
            # This used to assert the marketing title and passed only because CI has
            # no environment: the gate read `NEXT_PUBLIC_AUTH_MODE !== 'live'`, an
            # unset value meant "wave everything through", and the smoke test was
            # exercising a configuration that never ships. Production answers
            # `/` with 307 -> /login. So the honest assertion is the login form,
            # which also proves the gate and the redirect chain both work.
            routes: '[{"path":"/","expect":"<input type=\"password\""},{"path":"/login","expect":"<input type=\"password\""}]'
          # TanStack Start on a nitro node-server. Marketing pages are prerendered,
          # so `/` and `/pricing` render fully without any backing service.
          - app: web-vite
            artifact: apps/web-vite/.output/server/index.mjs
            port: '4173'
            start: node apps/web-vite/.output/server/index.mjs
            routes: '[{"path":"/","expect":"<title>Moyo — AI tutoring"},{"path":"/pricing","expect":"<title>Pricing — Moyo</title>"}]'
          # No `routes`: admin-vite is the Payload admin and cannot boot without a
          # reachable DATABASE_URL, which CI has no business holding. Build and
          # artifact coverage only — deliberately, not as an oversight.
          - app: admin-vite
            artifact: apps/admin-vite/.vercel/output/functions/__server.func/index.mjs
          # No `routes`: storybook is a static bundle with no server. `index.json` is
          # the story catalogue, so requiring a `"type":"story"` entry proves the build
          # indexed real stories rather than emitting an empty shell.
          - app: storybook
            artifact: apps/storybook/storybook-static/index.json
            artifact_contains: '"type":"story"'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.app }}
        run: pnpm exec turbo run build --filter=${{ matrix.app }}

      - name: Assert the build produced a deployable artifact
        env:
          APP: ${{ matrix.app }}
          ARTIFACT: ${{ matrix.artifact }}
          CONTAINS: ${{ matrix.artifact_contains }}
        run: |
          set -euo pipefail
          if [ ! -s "$ARTIFACT" ]; then
            echo "::error::$APP build exited 0 but $ARTIFACT is missing or empty"
            exit 1
          fi
          echo "ok  $ARTIFACT ($(wc -c < "$ARTIFACT" | tr -d ' ') bytes)"
          if [ -n "${CONTAINS:-}" ]; then
            # These template variables belong to JavaScript, not the shell.
            # shellcheck disable=SC2016
            node -e 'const fs=require("fs");const [f,s]=process.argv.slice(1);if(!fs.readFileSync(f,"utf8").includes(s)){console.log(`::error::${f} is missing the expected content ${JSON.stringify(s)}`);process.exit(1)}console.log(`ok  ${f} contains ${JSON.stringify(s)}`)' "$ARTIFACT" "$CONTAINS"
          fi

      - name: Boot the built server and assert routes
        if: matrix.routes != ''
        env:
          APP: ${{ matrix.app }}
          PORT: ${{ matrix.port }}
          START: ${{ matrix.start }}
          ROUTES: ${{ matrix.routes }}
        run: |
          set -euo pipefail

          # Node, not curl+grep, does the assertions: these pages are one long line
          # with no trailing newline, which grep classifies as binary, and a
          # multibyte pattern (the em dash in every <title>) then fails to match even
          # with `grep -a`. String.includes has no such trap and behaves identically
          # on every runner.
          cat > "$RUNNER_TEMP/smoke.mjs" <<'NODE'
          const app = process.env.APP;
          const base = `http://127.0.0.1:${process.env.PORT}`;
          const routes = JSON.parse(process.env.ROUTES);
          const serverPid = Number(process.env.SERVER_PID);
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          let up = false;
          for (let i = 0; i < 90; i++) {
            try {
              process.kill(serverPid, 0);
            } catch {
              console.log(`::error::${app} server process exited before it accepted a connection`);
              process.exit(1);
            }
            try {
              await fetch(base + routes[0].path, { signal: AbortSignal.timeout(5000) });
              up = true;
              break;
            } catch {
              await sleep(1000);
            }
          }
          if (!up) {
            console.log(`::error::${app} never accepted a connection on ${base}`);
            process.exit(1);
          }

          let failed = false;
          for (const { path, expect } of routes) {
            const res = await fetch(base + path, { signal: AbortSignal.timeout(30000) });
            const body = await res.text();
            if (res.status !== 200) {
              console.log(`::error::${app} ${path} returned HTTP ${res.status}, expected 200`);
              failed = true;
              continue;
            }
            if (!body.includes(expect)) {
              console.log(`::error::${app} ${path} returned 200 but the body is missing ${JSON.stringify(expect)}`);
              console.log(body.slice(0, 1500));
              failed = true;
              continue;
            }
            console.log(`ok  ${app} ${path} -> 200, ${body.length} chars, contains ${JSON.stringify(expect)}`);
          }
          process.exit(failed ? 1 : 0);
          NODE

          log="$(mktemp)"
          env PORT="$PORT" NODE_ENV=production sh -c "$START" > "$log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          if SERVER_PID="$server_pid" node "$RUNNER_TEMP/smoke.mjs"; then
            echo "$APP smoke passed"
          else
            echo "--- $APP server output ---"
            cat "$log"
            exit 1
          fi

  # Design evidence (tooling/web-designer-pro, VENDOR.md). Builds both web apps,
  # serves them the way `web-app` does, and renders them in real browsers:
  #   - shoot.mjs at 390/768/1280/1440 scans the rendered DOM at every width
  #     (contrast on real pixels, sideways scroll, clipped text, the keyboard
  #     focus walk, the slop tells) and exits 1 on any FAIL;
  #   - matrix.mjs re-renders under Windows scaling and High Contrast, Linux and
  #     Android fonts, Firefox, WebKit, a 320px reflow, reduced motion and
  #     translation-length text, and exits 1 on any FAIL;
  #   - check-font-fallbacks.mjs holds each `* Fallback` face to its real face.
  # apps/web is shot at /login: every other route redirects a signed-out
  # visitor there, and CI has no database to sign in against.
  # `--wait 2500` outlasts the site's slowest entrance (siteMotion `page-turn`,
  # 560ms, after its chapter delay), so a shot lands on the settled page.
  design-evidence:
    name: design evidence (${{ matrix.app }})
    runs-on: ubuntu-latest
    # One app per job. On a 2-core runner with no GPU the web-vite globe renders
    # in software, and its shoot alone took 34 minutes on the first run
    # (run 41919727784), so the two apps in one job outran a 40-minute limit.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web-vite
            port: '4173'
            start: node apps/web-vite/.output/server/index.mjs
            url: http://127.0.0.1:4173/
            shoot: --wait 2500
          - app: web
            port: '3101'
            start: pnpm --filter web start
            url: http://127.0.0.1:3101/login
            shoot: --app --wait 1500
            dark: --app --dark --widths 390,1440 --wait 1500
            matrix_flags: --app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Google Chrome ships on the runner image; Firefox and WebKit are the
      # matrix's optional engines and come from playwright-core's own installer.
      - name: Install Firefox and WebKit for the matrix
        run: node node_modules/playwright-core/cli.js install --with-deps firefox webkit
      - name: Build ${{ matrix.app }}
        run: pnpm exec turbo run build --filter=${{ matrix.app }}
      - name: Font fallbacks match their faces
        if: matrix.app == 'web-vite'
        run: node tooling/check-font-fallbacks.mjs
      - name: Shoot, scan and matrix
        env:
          APP: ${{ matrix.app }}
          PORT: ${{ matrix.port }}
          START: ${{ matrix.start }}
          URL: ${{ matrix.url }}
          SHOOT: ${{ matrix.shoot }}
          DARK: ${{ matrix.dark }}
          MATRIX_FLAGS: ${{ matrix.matrix_flags }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/design-evidence/$APP"
          mkdir -p "$out"
          env PORT="$PORT" NODE_ENV=production sh -c "$START" > "$out/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null "$URL"; then break; fi
            if [ "$i" = 90 ]; then echo "::error::$URL never answered"; cat "$out/server.log"; exit 1; fi
            sleep 1
          done
          status=0
          wdp=tooling/web-designer-pro/scripts
          # Flags are word-split on purpose: each matrix value is a flag list.
          # shellcheck disable=SC2086
          node $wdp/shoot.mjs "$URL" --out "$out/shots" $SHOOT || status=1
          if [ -n "${DARK:-}" ]; then
            # shellcheck disable=SC2086
            node $wdp/shoot.mjs "$URL" --out "$out/shots-dark" $DARK || status=1
          fi
          # shellcheck disable=SC2086
          node $wdp/matrix.mjs "$URL" --out "$out/matrix" ${MATRIX_FLAGS:-} || status=1
          exit $status
      - name: Upload shots and scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-evidence-${{ matrix.app }}
          path: ${{ runner.temp }}/design-evidence
          if-no-files-found: warn
          retention-days: 14
