name: Legend Spark desktop contracts

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "pnpm-workspace.yaml"
      - ".github/workflows/desktop-contracts.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "pnpm-workspace.yaml"
      - ".github/workflows/desktop-contracts.yml"

permissions:
  contents: read

jobs:
  contracts:
    name: isolated workspace / preview source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      # No pnpm install: Spark's native build needs macOS + Xcode and a
      # separately validated preview package graph. This job proves only
      # the source contract and must not be treated as native acceptance.
      - name: Validate desktop workspace and non-production gates
        run: node --test apps/desktop/tests/contract.test.mjs
      - name: Parse Metro configuration
        run: node --check apps/desktop/metro.config.js

  typecheck-preview:
    name: Spark preview (isolated install / TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Enable corepack
        run: corepack enable
      - name: Install only the isolated Expo Desktop 55 workspace
        working-directory: apps/desktop
        run: corepack pnpm install --no-frozen-lockfile
      - name: Typecheck native preview source
        working-directory: apps/desktop
        run: corepack pnpm typecheck
      # This does not build or launch an AppKit target; macOS runner native
      # compilation, menu interaction and signed release remain separate gates.
