# Existing engineering route; no seeded account or production endpoint.
appId: com.moyolearn.app
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- openLink: moyo://native-3d-smoke
- extendedWaitUntil:
    visible: Native 3D smoke
    timeout: 120000
- extendedWaitUntil:
    notVisible: 'adapter: probing…'
    timeout: 30000
- assertNotVisible: 'adapter FAILED:.*'
- assertVisible: 'adapter: .+'
- takeScreenshot: ${EVIDENCE_DIR}/01-adapter.png
- tapOn: Triangle
- extendedWaitUntil:
    visible: 'triangle: submitted and presented at [1-9][0-9]*x[1-9][0-9]*'
    timeout: 30000
- assertNotVisible: 'triangle FAILED:.*'
- takeScreenshot: ${EVIDENCE_DIR}/02-triangle.png
- tapOn: Stop
- tapOn: Cube
- extendedWaitUntil:
    visible: 'cube: renderer.init\(\) resolved'
    timeout: 30000
- extendedWaitUntil:
    visible: '[1-9][0-9]* fps'
    timeout: 30000
- assertNotVisible: 'cube FAILED:.*'
- takeScreenshot: ${EVIDENCE_DIR}/03-cube.png
# Background an active GPU loop, then require a fresh loop after resuming.
- pressKey: Home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: Native 3D smoke
    timeout: 30000
- tapOn: Stop
- assertNotVisible: '[0-9]+ fps'
- tapOn: Cube
- extendedWaitUntil:
    visible: '[1-9][0-9]* fps'
    timeout: 30000
- assertNotVisible: 'cube FAILED:.*'
- takeScreenshot: ${EVIDENCE_DIR}/04-resumed-cube.png
- tapOn: Stop
- assertNotVisible: '[0-9]+ fps'
- stopApp
- launchApp
- openLink: moyo://native-3d-smoke
- extendedWaitUntil:
    visible: Native 3D smoke
    timeout: 120000
- extendedWaitUntil:
    notVisible: 'adapter: probing…'
    timeout: 30000
- assertNotVisible: 'adapter FAILED:.*'
- assertVisible: 'adapter: .+'
- tapOn: Cube
- extendedWaitUntil:
    visible: '[1-9][0-9]* fps'
    timeout: 30000
- assertNotVisible: 'cube FAILED:.*'
- takeScreenshot: ${EVIDENCE_DIR}/05-cold-cube.png
- tapOn: Stop
- stopApp
