  # Declared explicitly even though react-native-screens already pulls it in:
  # `TutorPresence` imports `Freeze` directly, and a hoisted transitive is a
  # phantom dependency that disappears the day screens changes its own tree.
  # The version is the one screens resolves, so nothing new is installed.
  react-freeze: 1.0.4
  react-native-worklets: 0.12.2
  react-native-vision-camera: 5.2.3
  # HELD AT 0.9.3 — 0.10.2 is published and is an API break, not a bump.
  # 0.10 splits the flat export into subpaths (`react-native-executorch/cv`,
  # `/speech`, `/llm`, `/nlp`) and renames symbols: `OCRDetection` -> `OcrDetection`,
  # and `OCRModule`, `isAvailable`, `OCR_ENGLISH`, `SpeechToTextModule` and
  # `WHISPER_TINY_EN` are no longer on the root entry (a `/legacy` entry exists).
  # `packages/app/features/capture` imports all of those, so the migration is a
  # code change on the homework OCR path and has to be verified with a real model
  # init and an OCR inference on a device — not a version edit.
  react-native-executorch: 0.9.3
  # 0.9 moved resource fetching behind a pluggable adapter that the HOST APP must
  # register via `initExecutorch` — the core package ships no default, so without
  # this every model load fails with "ResourceFetcher adapter is not initialized"
  # (code 186) and both the OCR and Whisper paths die. The adapter is pure JS
  # (lib/*.js only, no android/ios/podspec), so it adds no native surface; it
  # reads through expo-file-system + expo-asset, which `expo` already depends on
  # and autolinks. Latest published adapter is 0.9.1 against core 0.9.3 — its
  # peer on the core is "*", and the two ship on independent release trains.
  # Its own release train, which is why the numbers do not match the line above.
  # Held with it: the fetcher registers into executorch's runtime.
  react-native-executorch-expo-resource-fetcher: 0.9.1
  "@shopify/react-native-skia": 2.12.0
  react-native-skia-graphite-android: 154.0.0
  react-native-skia-graphite-apple-ios: 154.0.0
  react-native-skia-graphite-apple-macos: 154.0.0
  "@react-navigation/native": 7.4.1
  solito: 5.0.0
  lucide-react: 1.47.0
  lucide-react-native: 1.47.0
  react-native-svg: 15.15.5
  react-native-pulsar: 1.7.0
  "@expo/html-elements": 57.0.0
  "@expo/ui": ~58.0.3
