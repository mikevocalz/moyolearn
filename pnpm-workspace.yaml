  # whiteboard (doc 23 §5's `LearningCanvas` renderer). Quickdraw ships one
  # engine and two bindings off it, cut from the same version — `@quickdrawjs/
  # react` mounts it into a div, `@quickdrawjs/react-native` serves the SAME
  # engine as an inlined HTML page inside a WebView. They must move together:
  # the RN package's board HTML is generated from `@quickdrawjs/core` at pack
  # time, so a version skew is two different engines drawing two different
  # snapshot shapes, and a board saved on a phone would not open on the web.
  #
  # THE THREE PINS BELOW ARE EXACT — no caret, no tilde — and that is a
  # correctness requirement rather than caution, because two seams in this repo
  # read parts of these packages that are not in their public contract:
  #
  #   packages/ui/xr/stroke-of.ts reads the INTERNAL shape of a stroke record.
  #     `ShapeRecord.props` is typed `Record<string, any>` in `@quickdrawjs/
  #     core`, so `props.pts` — `[[dx, dy, pressure], …]`, with `x`/`y` on the
  #     record as the origin — is a layout the package never promises. It was
  #     read out of `board-html.generated.js` and is what the headset draws its
  #     `ViroPolyline`s from. A patch release may change it and be within its
  #     rights; a caret would take that change silently.
  #
  #   packages/ui/whiteboard-board.native.tsx hosts the page itself, from
  #     `BOARD_HTML` + `createBridge` rather than from the `<Quickdraw>`
  #     component, because the component cannot be given a pointer (its
  #     `handlers` map has no input verb, and passing a ref through
  #     `webviewProps` REPLACES the vendor's own and kills the bridge). It also
  #     dispatches real `PointerEvent`s at `#board`, which is where
  #     `Editor._bind()` binds its whole pointer set — again, read from the
  #     generated page, not from a documented API.
  #
  # `stroke-of.ts` is defensive and skips a record it does not recognise, so the
  # failure mode of a silent bump is a child's strokes missing from the headset
  # with nothing thrown — which is why the version is held still and the bump is
  # made deliberately, against `stroke-of.test.ts` and the pointer path.
  #
  # `react-native-webview` is Quickdraw's own peer on native and the version is
  # `expo@57.0.15`'s `bundledNativeModules.json` entry, not npm's latest (16.x):
  # it is a native module, so the SDK's pin is the compatibility statement and
  # `expo install` would choose exactly this.
  # The board's document, and the reason it is a CRDT rather than a JSON blob:
  # Quickdraw's own sync page settles contention per record, last writer wins,
  # and a `Y.Map` keyed by record id is exactly that rule with merge, offline
  # reconnect and an origin-scoped undo stack already solved. It is also the
  # transport-agnostic shape — a provider is a constructor call, not a rewrite.
  #
  # No `y-websocket`/`y-indexeddb` here on purpose. This workspace has no
  # WebSocket service, and IndexedDB does not exist on React Native, so both
  # would be a dependency for a path nothing takes. Persistence is one encoded
  # update through the storage this feature already has.
  yjs: 13.6.32
  "@quickdrawjs/core": 0.2.0
  "@quickdrawjs/react": 0.2.0
  "@quickdrawjs/react-native": 0.2.0
  react-native-webview: 14.0.1

  # web
  next: 16.3.5
  nextjs-toploader: 3.9.17

  # styling (Uniwind — Tailwind 4 only; uniwind pins @tailwindcss/node to the
  # exact tailwindcss version below, so bump the two together or not at all)
  uniwind: 1.12.0
  tailwindcss: 4.3.3
  "@tailwindcss/postcss": 4.3.3
  "@tailwindcss/vite": 4.3.3
  react-native-css: 3.0.7
  tailwind-merge: 3.7.0
  tailwind-variants: 3.3.1

  # 3D / avatar renderer (doc 22). Pinned exactly, and bumped only by a
  # reviewed PR with golden diffs attached: r186 removes PCFSoftShadowMap on
  # WebGPU and changes PhysicalLightingModel.direct(), both of which move the
  # avatar's look. See docs/pack/22-embodied-tutor-avatar-spec.md §4 and §6.
  # r186 is published; taking it needs `packages/avatar`'s probe:shaders,
  # probe:shaders:webgpu and golden:compare run before and after, per the rule
  # above. It is not a version edit: r186's QuadMesh constructor now requires an
  # argument, which is a compile error in tutor-avatar-3d.native.tsx.
  three: 0.186.0
  # marketing site (apps/web-vite) — motion + globe. R3F 9 declares Expo peers
  # (expo-gl, react-native, expo-file-system) because it ships a native
  # renderer; this app is web-only, so those peers are intentionally unmet.
  gsap: 3.15.0
  lenis: 1.3.26
  "@react-three/fiber": 9.7.0
  "@react-three/drei": 10.7.8
  topojson-client: 3.1.0
  "@types/topojson-client": 3.1.5
  "@types/three": 0.186.0

  # state / data
  "@tanstack/react-query": 5.103.1
  "@tanstack/react-virtual": 3.14.13
  "@tanstack/react-form": 1.33.5
  "@tanstack/react-pacer": 0.23.0
  "@tanstack/react-table": 8.21.3
  # Marketing-site routing + SSR (ADR-001). Start is Router plus a server, so
  # `src/routes` + createFileRoute + routeTree.gen.ts are the same artefacts in
  # both — the SPA fallback (Lane B) is a plugin swap, not a rewrite. Start's
  # vite peer is `>=7.0.0`, which is why the `vite` entry below is 7.x.
  "@tanstack/react-router": 1.170.38
  "@tanstack/react-start": 1.168.56
  "@legendapp/list": 3.3.11
  "@legendapp/motion": 2.5.3
  date-fns: 4.4.0
  zustand: 5.0.15
  zod: 4.6.5
  # Handoff QR (doc 36 §2 / doc 37 §2): pure-JS encoder only — `create()` gives
  # the module matrix synchronously and the panel draws it with kit Views, so
  # one universal component serves web and native with no react-native-svg on
  # the web bundle (see TrendLine.web.tsx's header for why that import is fatal
  # under Turbopack).
  qrcode: 1.5.4
  "@types/qrcode": 1.5.6

  # backend / cms
  # The build-time tripwire on repositories/services (doc 11 §6). On native the
  # leak this catches isn't server actions — it's Payload credentials and
  # inference keys ending up readable inside an app binary.
  server-only: 0.0.1
  payload: 4.0.0-canary.33
  "@payloadcms/db-postgres": 4.0.0-canary.33
  "@payloadcms/next": 4.0.0-canary.33
  "@payloadcms/plugin-mcp": 4.0.0-canary.33
  "@payloadcms/ui": 4.0.0-canary.33
  # The super admin's mount (ADR-003). Its `payload` peer is an EXACT pin —
  # `4.0.0-canary.33`, not a range — so this line and the `payload` line above
  # move together or install fails outright rather than drifting.
  "@payloadcms/tanstack-start": 4.0.0-canary.33
  graphql: 16.14.2 # payload peers ^16
  pg: 8.23.0
  # The job runner (doc 12 §6 · docs/design/jobs.md). Same Postgres, `jobs`
  # schema. Its own `pg` dependency is `^8.23.0`, which is the line above
  # exactly — one driver in the workspace, not two, so the queue and the
  # repositories cannot disagree about how a timestamp comes back.
  pg-boss: 12.33.0
  # HELD AT 1.7.2 — 1.7.5 is published and breaks this schema, not the code.
  # `packages/payload/migrations/better_auth_tables.sql` is verbatim 1.7.2
  # `better-auth generate` output: `account."issuer"` is `text not null` with no
  # default, and there is a unique index on (issuer, accountId). 1.7.5 stopped
  # writing that column, so every insert into `account` fails — signup and OAuth
  # linking with it. Taking 1.7.5 means regenerating the DDL with its CLI and
  # migrating the column and index away per the 1.7 upgrade guide, against a
  # disposable database. That is a schema change, not a version bump.
  better-auth: 1.7.2
  "@better-auth/expo": 1.7.2
  "@better-auth/stripe": 1.7.2
  # The Better Auth CLI, and yes it is called `auth`. `@better-auth/cli` was
  # renamed to the bare `auth` package at v1.6 and the old name stops at 1.4.22,
  # so "install the CLI matching better-auth@1.7.1" means this line and not that
  # one. Same version as `better-auth` above on purpose: it generates the DDL for
  # the adapter shipped in that exact release.
  auth: 1.7.2
  stripe: 22.6.2
  sharp: 0.35.4
  "@types/pg": 8.23.1

  # observability (doc 12 §7 · docs/design/slo.md). Two SDKs, one release train
  # — @sentry/nextjs 10.x and @sentry/react-native 8.x are cut together and
  # share @sentry/core, so they are bumped together or the two apps report
  # against different event schemas. @sentry/react-native 8.24.0 builds and
  # tests against react-native 0.86.2, which is the version in this catalog.
  #
  # Neither SDK initialises without a DSN, so a checkout with no SENTRY_DSN /
  # EXPO_PUBLIC_SENTRY_DSN runs with the reporter off rather than half on.
  "@sentry/nextjs": 10.75.0
  "@sentry/react-native": 8.27.0

  # tooling
  typescript: ~6.0.3
  # Dev-only, and used by exactly one package: @acme/avatar's shader probe
  # bundles its materials for a headless browser (esbuild) and drives that
  # browser (playwright). Neither reaches a shipped bundle — the probe is a
  # compile gate, not a runtime path — but they belong in the catalog like
  # everything else so there is still one declared version.
  esbuild: 0.28.2
  playwright: 1.63.0
  "@types/react": ~19.3.0
  # Must stay on the Node major `engines.node` (>=24.15.0 <26) actually allows —
  # typing against 26 describes a runtime this repo refuses to start on.
  "@types/node": ^24.13.3
  "@types/react-dom": ^19.3.0
  eslint: ^9.39.2
  eslint-config-expo: ~57.0.2
  eslint-config-next: 16.3.5
  "@eslint/eslintrc": ^3.3.7
  storybook: 10.6.0
  "@storybook/react-vite": 10.6.0
  "@storybook/addon-a11y": 10.6.0
  # Vite 8 + plugin-react 6, required by @payloadcms/tanstack-start (it peers
  # vite >=8, @vitejs/plugin-react ^6 and @vitejs/plugin-rsc ^0.5.21). The
  # earlier 7.x pin existed only because plugin-react 4.7.0 stopped at ^7;
  # bumping both together removes that ceiling. @storybook/builder-vite@10.5.8
  # peers ^5||^6||^7||^8, so Storybook rides along.
  vite: 8.3.0
  nitro: 3.0.260610-beta
  "@vitejs/plugin-react": 6.1.1
  # The React Server Components environment the Payload admin renders in
  # (ADR-003). `@payloadcms/tanstack-start` peers `^0.5.21`; this is the
  # version its own demo ships against, which is the only combination anyone
  # has run.
  #
  # `react-server-dom-webpack` is NOT here, although plugin-rsc names it as an
  # optional peer and the Payload demo declares it. plugin-rsc vendors its own
  # copy (node_modules/@vitejs/plugin-rsc/dist/vendor/react-server-dom/) and
  # never resolves the bare specifier; adding then removing it produced a
  # byte-identical `dist/client/index.js` (md5 e5d5b495…), so it was carrying
  # nothing but install weight and an unmet `webpack` peer.
  "@vitejs/plugin-rsc": 0.5.35
  vite-plugin-react-native-web: 2.5.0
  babel-plugin-react-compiler: 1.0.0
  turbo: 2.10.13
