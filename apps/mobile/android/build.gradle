// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    def kotlinVersion = findProperty('android.kotlinVersion')
    classpath(kotlinVersion ? "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion" : 'org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
        // expo-pico-core: pico maven repo
        maven {
            url "https://developer.pico-interactive.com/maven"
            content {
                includeGroup "com.pvr"
                includeGroup "com.pvr.platform"
            }
        }
        // PICO Platform Service SDK (com.pico.pps:*) — public maven hosted
        // by Bytedance, referenced from the PPS integration doc at
        // https://developer.picoxr.com/document/platform_service/integrate-the-pico-platform-service-sdk/
        maven {
            url "https://artifact.bytedance.com/repository/Volcengine/"
            content {
                includeGroup "com.pico.pps"
                includeGroup "com.pico"
            }
        }

    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}


// Moyo: propagate device flavors through Expo to platform modules.
project(":expo") {
    plugins.withId("com.android.library") {
        android {
            flavorDimensions += "device"
            productFlavors {
                mobile { dimension "device" }
                quest { dimension "device" }
                pico { dimension "device"; matchingFallbacks = ["mobile"] }
            }
        }
    }
}

// Moyo: pin the source-verified precision drawing renderer.
ext.moyoViroRendererAar = rootProject.file('../../../vendors/viro-renderer-034d3b9.aar')
if (!moyoViroRendererAar.isFile()) {
    throw new GradleException('Pinned Moyo controller renderer is missing')
}
def rendererDigest = java.security.MessageDigest.getInstance('SHA-256')
moyoViroRendererAar.withInputStream { stream ->
    byte[] buffer = new byte[65536]
    int count
    while ((count = stream.read(buffer)) != -1) rendererDigest.update(buffer, 0, count)
}
if (rendererDigest.digest().encodeHex().toString() != '08c22843d1311cbc52ae973b8a97dd8186a86c72d3682312a50a00c198506a3b') {
    throw new GradleException('Pinned Moyo controller renderer checksum mismatch')
}

// CI's 16 GiB runner cannot sustain multiple unbounded Ninja compiler pools.
// This opt-in changes scheduling only; local builds retain their existing defaults.
// SOT-KEYWORDS: android native ci memory ninja compile link pool
def moyoNativeJobPool = providers.gradleProperty('moyoNativeJobPool').orNull
if (moyoNativeJobPool != null) {
    if (moyoNativeJobPool != '2') {
        throw new GradleException('moyoNativeJobPool supports only the reviewed CI depth of 2')
    }
    subprojects { sub ->
        ['com.android.application', 'com.android.library'].each { pluginId ->
            sub.plugins.withId(pluginId) {
                // Libraries may replace their argument list in their own DSL.
                // Append at AGP's supported finalization point, before variants.
                sub.extensions.getByName('androidComponents').finalizeDsl { androidDsl ->
                    androidDsl.defaultConfig.externalNativeBuild.cmake.arguments.addAll([
                        '-DCMAKE_JOB_POOLS=moyo_native=2',
                        '-DCMAKE_JOB_POOL_COMPILE=moyo_native',
                        '-DCMAKE_JOB_POOL_LINK=moyo_native'
                    ])
                }
            }
        }
    }
}

// React's root plugin eagerly evaluates :app. Register finalizeDsl callbacks
// first, otherwise AGP 9 rejects registration after the app DSL is finalized.
apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// expo-pico-core: subprojects missing-dim fallback
subprojects { sub ->
    if (sub.path == ":expo") return
    sub.plugins.withId("com.android.library") {
        sub.android {
            defaultConfig {
                missingDimensionStrategy 'device', 'mobile'
            }
        }
    }
}

// expo-pico-core: single-version pin for com.pico.pps:*
allprojects {
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            def requested = details.requested
            if (requested.group == "com.pico.pps" &&
                (requested.name.startsWith("platform-service-") || requested.name == "pps_sdk_base")) {
                details.useVersion "1.0.0"
                details.because "expo-pico-core pins the PICO Platform Service SDK to a single version"
            }
        }
    }
}
